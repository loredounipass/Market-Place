version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - backend-mongodb:/data/db
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - backend-redis:/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend/storecore
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Hot-reload mapping (codigo local se sincroniza en docker)
    volumes:
      - ./backend/storecore:/usr/src/app
      - /usr/src/app/node_modules # Evita sobreescribir dependencias de linux
    networks:
      - app-network
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Hot-reload mapping
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80" # Unico puerto expuesto al exterior
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  backend-mongodb:
    driver: local
  backend-redis:
    driver: local